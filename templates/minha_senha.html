{% extends "base.html" %}
{% block titulo %}Minha senha — Emissor NFS-e{% endblock %}
{% block conteudo %}
<div class="cartao estreito">
  <h1>Trocar minha senha</h1>
  <form method="post" class="formulario">
    <label>Senha atual <input type="password" name="atual" autocomplete="current-password" required></label>
    <label>Nova senha (mínimo 8 caracteres) <input type="password" name="senha" minlength="8" autocomplete="new-password" required></label>
    <label>Confirme a nova senha <input type="password" name="confirmacao" minlength="8" autocomplete="new-password" required></label>
    <button type="submit">Salvar</button>
  </form>
</div>
{% endblock %}
